[project]
name = "haplo"
dynamic = ["version"]
description = ""
authors = [
    { name = "Greg Olmschenk", email = "greg@olmschenk.com" },
]
readme = "readme.md"
requires-python = ">=3.11"

dependencies = [
    "torch>=2.0.1",
    "torch!=2.4.0,!=2.4.1,!=2.8.*; platform_system == 'Windows'",
    "stringcase>=1.2.0",
    "filelock>=3.12.3",
    "numpy>=1.25.2",
    "onnx>=1.14.1",
    "onnxruntime>=1.15.1",
    "pandas>=2.1.0",
    "polars>=0.20",
    "pyarrow>=13.0.0",
    "wandb>=0.18.0",
    "pytest>=7.4.2",
    "bokeh>=3.2.2",
    "sqlalchemy>=2.0.21",
    "connectorx>=0.3.2",
    "tenacity>=8.2.3",
    "myst-parser",
    "furo>=2023.9.10",
    "dask>=2023.1.1,<2025.4.0",  # TODO: Remove restriction when dependencies fix Zip bug.
    "xarray>2023.1.0",
    "zarr>=3.0.0",
    "numcodecs>=0.15.0,!=0.16.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/haplo/__about__.py"

[tool.hatch.build.targets.wheel]
packages = [
    "src/haplo",
]

[tool.hatch.envs.default]
dependencies = [
    "coverage[toml]>=6.5",
    "pytest",
]
[tool.hatch.envs.default.scripts]
test = [
    "pip list --verbose",
    "pytest {args:tests}",
]
test-cov = "coverage run -m pytest {args:tests}"
cov-report = [
    "- coverage combine",
    "coverage report",
]
cov = [
    "test-cov",
    "cov-report",
]

[[tool.hatch.envs.all.matrix]]
python = ["3.11", "3.12"]

[tool.hatch.envs.types]
dependencies = [
    "mypy>=1.0.0",
]
[tool.hatch.envs.types.scripts]
check = "mypy --install-types --non-interactive {args:src/haplo tests}"

[tool.coverage.run]
source_pkgs = ["haplo", "tests"]
branch = true
parallel = true
omit = [
    "src/haplo/__about__.py",
]

[tool.coverage.paths]
haplo = ["src/haplo", "*/haplo/src/haplo"]
tests = ["tests", "*/haplo/tests"]

[tool.coverage.report]
exclude_lines = [
    "no cov",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]
